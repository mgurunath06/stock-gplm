[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-gplm"
version = "0.1.0"
description = "Local, reproducible Indian equity research foundation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
oracle-auth = ["selenium==4.52.0"]
# Research-only daily training (M3.5); core ingestion and validation stay dependency-free.
m35 = ["numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5"]
# Local-first behaviour discovery (M5.4); no network or LLM dependency.
m54 = ["numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.11,<2"]
# GPLM research application (M5.5); GPU acceleration additionally needs a CUDA build of torch (see windows/install.ps1).
app = ["numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2"]
gpu = ["torch>=2.7"]

[project.scripts]
stock-gplm = "stock_gplm.cli:main"
stock-gplm-accept = "stock_gplm.acceptance_cli:main"
stock-gplm-quality = "stock_gplm.m2.cli:main"
stock-gplm-reference = "stock_gplm.m2.reference_cli:main"
stock-gplm-master-validate = "stock_gplm.m2.master_cli:main"
stock-gplm-inventory = "stock_gplm.m2.inventory_cli:main"
stock-gplm-sync = "stock_gplm.m24.cli:main"
stock-gplm-minute = "stock_gplm.m3.minute_cli:main"
stock-gplm-auth = "stock_gplm.m25.cli:main"
stock-gplm-readiness = "stock_gplm.m3.cli:main"
stock-gplm-research = "stock_gplm.m3.research_cli:main"
stock-gplm-train = "stock_gplm.m35.cli:main"
stock-gplm-evidence = "stock_gplm.m36.cli:main"
stock-gplm-explore = "stock_gplm.m37.cli:main"
stock-gplm-diagnose = "stock_gplm.m38.cli:main"
stock-gplm-nse-mcp = "stock_gplm.m39.cli:main"
stock-gplm-strategy-studio = "stock_gplm.v1.studio:main"
stock-gplm-strategy-demo = "stock_gplm.v1.demo:main"
stock-gplm-m5 = "stock_gplm.m5.cli:main"
gplm = "stock_gplm.app.cli:main"
gplm-research = "stock_gplm.m54.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
